# =============================================================================
# kubernetes/00-secrets.yaml
#
# OPTIONAL "Level 2" manifest. Demo credentials only - matching the defaults
# already used in docker-compose.yml (thermos/thermos). Change these if you
# adapt this for anything beyond a KodeKloud learning session.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: thermos-secrets
type: Opaque
stringData:
  POSTGRES_USER: thermos
  POSTGRES_PASSWORD: thermos
  POSTGRES_DB: thermos
  DATABASE_URL: postgresql://thermos:thermos@postgres:5432/thermos
  SECRET_KEY: dev-secret-key-change-in-prod
